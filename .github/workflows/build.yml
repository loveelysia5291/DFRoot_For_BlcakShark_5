name: Build

# One job, one command: ./gradlew :app:assembleSlim.
# A tag (v4.9.0, ...) also publishes the APK as a GitHub Release asset.
on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slim:
    name: assembleSlim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # compileSdk is 37; the runner image usually lags one platform behind.
      - name: Install Android SDK 37
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0" || true

      # The slim build is signed with the committed keystore/debug.keystore, so
      # no secret is needed and the APK installs as an update over earlier
      # DFRoot builds. If you later switch the slim signingConfig to "release",
      # add KEYSTORE_FILE / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD as
      # repository secrets and this step turns them into signing.properties.
      - name: Signing
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_PASSWORD}" ]; then
            {
              echo "KEYSTORE_FILE=${KEYSTORE_FILE}"
              echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}"
              echo "KEY_ALIAS=${KEY_ALIAS}"
              echo "KEY_PASSWORD=${KEY_PASSWORD}"
            } > signing.properties
            echo "signing.properties written from secrets"
          else
            echo "no signing secrets: assembleSlim uses keystore/debug.keystore"
          fi

      - name: Build DFRoot (slim)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleSlim --no-daemon --stacktrace

      - name: Show APK
        run: |
          ls -l app/build/outputs/apk/slim/
          sha256sum app/build/outputs/apk/slim/DFRoot_*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DFRoot-slim
          path: app/build/outputs/apk/slim/DFRoot_*.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/slim/DFRoot_*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
