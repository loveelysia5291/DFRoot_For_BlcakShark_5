name: Build

# One job, one command: ./gradlew :app:assembleRelease.
# Every push to the default branch (or a manual run) builds the APK and
# republishes the rolling "latest" release - no tagging by hand.
on:

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: assembleRelease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # compileSdk is 37; the runner image usually lags one platform behind.
      - name: Install Android SDK 37
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0" || true

      # assembleRelease signs with your key when KEYSTORE_BASE64 is set, and
      # falls back to the committed keystore/debug.keystore otherwise, so the
      # job produces an installable APK either way. The keystore file itself is
      # gitignored, which is why it has to travel as a base64 secret:
      #   base64 -w0 keystore/release.keystore
      - name: Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_BASE64}" ]; then
            STORE="${KEYSTORE_FILE:-keystore/release.keystore}"
            mkdir -p "$(dirname "$STORE")"
            printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "$STORE"
            {
              echo "KEYSTORE_FILE=${STORE}"
              echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}"
              echo "KEY_ALIAS=${KEY_ALIAS}"
              echo "KEY_PASSWORD=${KEY_PASSWORD}"
            } > signing.properties
            echo "release signing: ${STORE}"
          else
            echo "no KEYSTORE_BASE64 secret: release falls back to keystore/debug.keystore"
          fi

      - name: Build DFRoot
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: Show APK
        run: |
          ls -l app/build/outputs/apk/release/
          sha256sum app/build/outputs/apk/release/DFRoot_*.apk

      - name: Read version
        id: ver
        run: |
          APK=$(ls app/build/outputs/apk/release/DFRoot_*.apk | head -n1)
          VER=$(basename "$APK" .apk)
          VER=${VER#DFRoot_}
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "apk=${APK}" >> "$GITHUB_OUTPUT"
          echo "building DFRoot ${VER}"

      - uses: actions/upload-artifact@v4
        with:
          name: DFRoot-release
          path: app/build/outputs/apk/release/DFRoot_*.apk
          if-no-files-found: error

      # No manual tagging: every push to the default branch (and every manual
      # dispatch) republishes this one rolling release, replacing the APK. The
      # "latest" tag behind it is created by the action on the first run.
      # Prefer one release per version? Set tag_name to v${{ steps.ver.outputs.version }}
      # and the tag will be created from the built versionName instead.
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: DFRoot ${{ steps.ver.outputs.version }}
          body: |
            DFRoot ${{ steps.ver.outputs.version }}

            Android 12 / kernel 4.19 臨時 root 注入工具（Magisk）。

            - 安裝前請先安裝 Magisk，本工具不會幫你安裝或卸載管理器
            - 部署時直接讀取已安裝管理器的 APK 取出檔案，不需要匯入
            - su 只存在於 `/debug_ramdisk/su`
            - arm64-v8a，單一 APK

            簽章：`keystore/debug.keystore`（與舊版 DFRoot 相同，可直接覆蓋安裝）
          files: ${{ steps.ver.outputs.apk }}
          fail_on_unmatched_files: true
          make_latest: true
          draft: false
          prerelease: false
