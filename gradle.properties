android.useAndroidX=true
android.overridePathCheck=true

# The app uses Kotlin 2.4.20 because MIUIX 0.9.4 is published with that
# compiler. AGP 9's built-in Kotlin is 2.2.10, which cannot read 2.4 metadata,
# so opt out and let the Kotlin Gradle plugin manage compilation. KGP 2.4.20
# still targets AGP's legacy DSL (AGP 9 new DSL rejects third-party Kotlin
# plugins), hence newDsl is disabled too.
android.builtInKotlin=false
android.newDsl=false
